<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erika González — Del código a la vida real</title>
    <meta
      name="description"
      content="Erika González, ingeniera de sistemas en el Quindío. Software, webs e inteligencia artificial para resolver cosas concretas."
    />
    <meta name="theme-color" content="#ECECEE" />
    <meta property="og:title" content="Erika González — Del código a la vida real" />
    <meta
      property="og:description"
      content="Ingeniera de Sistemas. Software, webs e IA para resolver cosas concretas."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://erika-gonzalez.com/" />
    <meta property="og:image" content="https://erika-gonzalez.com/og.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;700&family=Inter+Tight:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var stored = localStorage.getItem('erika-theme')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#141416' : '#ECECEE')
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
